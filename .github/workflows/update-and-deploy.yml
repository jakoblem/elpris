name: Opdater elpriser og tariffer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_tariffs.py"
      - ".github/workflows/update-and-deploy.yml"
  schedule:
    # Prisdata: bredt UTC-vindue dækker kl. 13 dansk tid ved sommer/vintertid.
    - cron: "2-57/5 11-13 * * *"
    # Tariffer ændres langt sjældnere, men datasættet opdateres dagligt om morgenen.
    - cron: "17 7 * * *"

permissions:
  contents: write

concurrency:
  group: "elpris-update"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Sæt Python op
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hent spotpriser fra Energinet
        run: python scripts/fetch_prices.py

      - name: Hent nettariffer fra Energinet
        run: python scripts/fetch_tariffs.py

      - name: Gem nye data
        run: |
          if git diff --quiet -- data/prices.json data/tariffs.json data/fx.json; then
            echo "Ingen nye data."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/prices.json data/tariffs.json data/fx.json
            git commit -m "Opdater elpriser og tariffer"
            git push
          fi
