name: Test dataopdatering
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "sw.js"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/test_app.cjs
      - run: node --check app.js && node --check sw.js
