name: Opdater elpriser

on:
  workflow_dispatch:
  schedule:
    # Bredt UTC-vindue dækker kl. 13 dansk tid ved både sommer- og vintertid.
    - cron: "2-57/5 11-13 * * *"

permissions:
  contents: write

concurrency:
  group: "elpris-update"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Sæt Python op
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hent priser fra Energinet
        run: python scripts/fetch_prices.py

      - name: Gem nye priser
        run: |
          if git diff --quiet -- data/prices.json; then
            echo "Ingen nye prisdata."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/prices.json
            git commit -m "Opdater elpriser"
            git push
          fi
